<svg xmlns="http://www.w3.org/2000/svg" width="260" height="74" viewBox="0 0 260 74" fill="none">
  <defs>
    <!-- Frosted Glass Surface Gradient -->
    <linearGradient id="glass_surf_python" x1="0" y1="0" x2="260" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1316" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#140E10" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0809" stop-opacity="0.95" />
    </linearGradient>

    <!-- Specular Bevel Border (Light reflecting on top-left edge) -->
    <linearGradient id="glass_border_python" x1="0" y1="0" x2="260" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#FF3344" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#3D0B0F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Crimson Wave Glow Gradient -->
    <linearGradient id="wave_grad_python" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow_python" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Drop Shadow Base -->
  <rect x="2" y="3" width="256" height="69" rx="12" fill="#000000" fill-opacity="0.7" />

  <!-- Glass Card Main Body -->
  <rect x="1" y="1" width="258" height="71" rx="12" fill="url(#glass_surf_python)" stroke="url(#glass_border_python)" stroke-width="1.2" />

  <!-- Decorative Background Micro-Wave Graph (Living Dashboard aesthetic) -->
  <path d="M150 60 Q 175 46, 200 52 T 240 42 L 240 68 L 150 68 Z" fill="url(#wave_grad_python)" />
  <path d="M150 60 Q 175 46, 200 52 T 240 42" stroke="#E50914" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />
  <circle cx="240" cy="42" r="2" fill="#FF3344" filter="url(#glow_python)" />

  <!-- Glass Icon Container -->
  <g transform="translate(14, 16)">
    <rect width="40" height="40" rx="10" fill="#170F12" stroke="#4A141A" stroke-width="1" />
    <svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="#FACC15">
      <path d="M11.858 0c-.978.005-1.913.088-2.736.234C6.7.662 6.26 1.558 6.26 3.21v2.182h5.725v.727H4.111c-1.664 0-3.121 1-3.577 2.903-.526 2.181-.549 3.542 0 5.82.407 1.694 1.379 2.902 3.043 2.902h1.969v-2.616c0-1.89 1.635-3.557 3.576-3.557h5.72c1.591 0 2.862-1.31 2.862-2.91v-5.45c0-1.553-1.309-2.718-2.863-2.977A18 18 0 0 0 11.858 0M8.762 1.755c.591 0 1.074.491 1.074 1.095 0 .601-.483 1.087-1.074 1.087A1.08 1.08 0 0 1 7.688 2.85c0-.604.48-1.095 1.074-1.095m9.656 4.364v2.543c0 1.971-1.671 3.63-3.577 3.63H9.122c-1.566 0-2.862 1.34-2.862 2.91v5.452c0 1.551 1.349 2.464 2.862 2.91 1.813.532 3.55.628 5.72 0 1.44-.418 2.862-1.258 2.862-2.91V18.47h-5.719v-.727h8.582c1.664 0 2.284-1.16 2.862-2.903.598-1.793.573-3.518 0-5.819-.41-1.656-1.196-2.903-2.862-2.903zm-3.216 13.807a1.08 1.08 0 0 1 1.074 1.088c0 .604-.48 1.094-1.074 1.094-.592 0-1.075-.49-1.075-1.094 0-.601.483-1.088 1.075-1.088"/>
    </svg>
  </g>

  <!-- Title & Specialty -->
  <text x="64" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">Python</text>
  <text x="64" y="47" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.1">Data Pipelines • Scripts</text>

  <!-- Top-Right Glowing Status Pill -->
  <g transform="translate(210, 10)">
    <rect width="38" height="14" rx="7" fill="#2E0A0F" stroke="#E50914" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="7" cy="7" r="2" fill="#FF3344" filter="url(#glow_python)" />
    <text x="13" y="10" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">LIVE</text>
  </g>
</svg>