<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" fill="none">
  <defs>
    <!-- Outer Bevel Gradient -->
    <linearGradient id="bevel_btn-repos.svg" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3D0C0C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#150404" stop-opacity="0.6" />
    </linearGradient>

    <!-- Surface Titanium Gradient -->
    <linearGradient id="surface_btn-repos.svg" x1="0" y1="0" x2="200" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A22" />
      <stop offset="40%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Top Highlight Inner Specular -->
    <linearGradient id="specular_btn-repos.svg" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#FF3344" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <filter id="led_glow_btn-repos.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Drop Shadow Base -->
  <rect x="2" y="3" width="196" height="42" rx="9" fill="#000000" fill-opacity="0.6" />

  <!-- Outer Bevel Rim -->
  <rect x="1" y="1" width="198" height="43" rx="9" fill="url(#surface_btn-repos.svg)" stroke="url(#bevel_btn-repos.svg)" stroke-width="1.5" />

  <!-- Inner Specular Reflection Line -->
  <line x1="12" y1="3" x2="188" y2="3" stroke="url(#specular_btn-repos.svg)" stroke-width="1" stroke-linecap="round" />

  <!-- Left LED Power Dot Indicator -->
  <circle cx="20" cy="22" r="3" fill="#B91C1C" filter="url(#led_glow_btn-repos.svg)" />
  <circle cx="20" cy="22" r="1.5" fill="#FFFFFF" />

  <!-- Icon Section -->
  <g transform="translate(32, 14)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M9 1C4.58 1 1 4.58 1 9c0 3.54 2.29 6.54 5.47 7.6.4.07.55-.17.55-.38 0-.19-.01-.69-.01-1.36-2.22.48-2.69-1.07-2.69-1.07-.36-.93-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.22.83 1.22.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.96 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 9 4.87c.68 0 1.36.09 2 .27 1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.08-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.01 8.01 0 0 0 17 9c0-4.42-3.58-8-8-8z" fill="#E50914"/>
  </g>

  <!-- Typography -->
  <text x="56" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">REPOSITORIOS</text>
  
  <!-- Right Micro Arrow -->
  <path d="M182 19L185 22L182 25" stroke="#E50914" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>