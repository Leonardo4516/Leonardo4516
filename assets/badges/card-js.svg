<svg xmlns="http://www.w3.org/2000/svg" width="260" height="74" viewBox="0 0 260 74" fill="none">
  <defs>
    <!-- Frosted Glass Surface Gradient -->
    <linearGradient id="glass_surf_js" x1="0" y1="0" x2="260" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1316" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#140E10" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0809" stop-opacity="0.95" />
    </linearGradient>

    <!-- Specular Bevel Border (Light reflecting on top-left edge) -->
    <linearGradient id="glass_border_js" x1="0" y1="0" x2="260" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#FF3344" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#3D0B0F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Crimson Wave Glow Gradient -->
    <linearGradient id="wave_grad_js" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow_js" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Drop Shadow Base -->
  <rect x="2" y="3" width="256" height="69" rx="12" fill="#000000" fill-opacity="0.7" />

  <!-- Glass Card Main Body -->
  <rect x="1" y="1" width="258" height="71" rx="12" fill="url(#glass_surf_js)" stroke="url(#glass_border_js)" stroke-width="1.2" />

  <!-- Decorative Background Micro-Wave Graph (Living Dashboard aesthetic) -->
  <path d="M150 60 Q 175 46, 200 52 T 240 42 L 240 68 L 150 68 Z" fill="url(#wave_grad_js)" />
  <path d="M150 60 Q 175 46, 200 52 T 240 42" stroke="#E50914" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />
  <circle cx="240" cy="42" r="2" fill="#FF3344" filter="url(#glow_js)" />

  <!-- Glass Icon Container -->
  <g transform="translate(14, 16)">
    <rect width="40" height="40" rx="10" fill="#170F12" stroke="#4A141A" stroke-width="1" />
    <svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="#FACC15">
      <path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/>
    </svg>
  </g>

  <!-- Title & Specialty -->
  <text x="64" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">JavaScript</text>
  <text x="64" y="47" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.1">HTML5 • CSS3 • Web APIs</text>

  <!-- Top-Right Glowing Status Pill -->
  <g transform="translate(210, 10)">
    <rect width="38" height="14" rx="7" fill="#2E0A0F" stroke="#E50914" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="7" cy="7" r="2" fill="#FF3344" filter="url(#glow_js)" />
    <text x="13" y="10" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">LIVE</text>
  </g>
</svg>