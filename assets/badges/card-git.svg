<svg xmlns="http://www.w3.org/2000/svg" width="220" height="74" viewBox="0 0 220 74" fill="none">
  <defs>
    <!-- Frosted Glass Surface Gradient -->
    <linearGradient id="glass_surf_card-git.svg" x1="0" y1="0" x2="220" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1316" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#140E10" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0809" stop-opacity="0.95" />
    </linearGradient>

    <!-- Specular Bevel Border (Light reflecting on top-left edge) -->
    <linearGradient id="glass_border_card-git.svg" x1="0" y1="0" x2="220" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#FF3344" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#3D0B0F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Crimson Wave Glow Gradient -->
    <linearGradient id="wave_grad_card-git.svg" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow_card-git.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Drop Shadow Base -->
  <rect x="2" y="3" width="216" height="69" rx="12" fill="#000000" fill-opacity="0.7" />

  <!-- Glass Card Main Body -->
  <rect x="1" y="1" width="218" height="71" rx="12" fill="url(#glass_surf_card-git.svg)" stroke="url(#glass_border_card-git.svg)" stroke-width="1.2" />

  <!-- Decorative Background Micro-Wave Graph (Living Dashboard aesthetic) -->
  <path d="M120 60 Q 140 46, 160 52 T 200 42 L 200 68 L 120 68 Z" fill="url(#wave_grad_card-git.svg)" />
  <path d="M120 60 Q 140 46, 160 52 T 200 42" stroke="#E50914" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />
  <circle cx="200" cy="42" r="2" fill="#FF3344" filter="url(#glow_card-git.svg)" />

  <!-- Glass Icon Container -->
  <g transform="translate(14, 16)">
    <rect width="40" height="40" rx="10" fill="#170F12" stroke="#4A141A" stroke-width="1" />
    <svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path fill="#F97316" d="M21.7 10.3L13.7 2.3c-.4-.4-1-.4-1.4 0L9.8 4.8l2.6 2.6c.4-.1.8 0 1.1.3.4.4.4 1 0 1.4l-2.6 2.6c-.4.4-1 .4-1.4 0-.3-.3-.4-.7-.3-1.1L6.7 8.1l-4.4 4.4c-.4.4-.4 1 0 1.4l8 8c.4.4 1 .4 1.4 0l9.9-9.9c.5-.5.5-1.2.1-1.7z"/>
    </svg>
  </g>

  <!-- Title & Specialty -->
  <text x="64" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">Git • Conventional</text>
  <text x="64" y="47" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.1">Control de Versiones</text>

  <!-- Top-Right Glowing Status Pill -->
  <g transform="translate(170, 10)">
    <rect width="38" height="14" rx="7" fill="#2E0A0F" stroke="#E50914" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="7" cy="7" r="2" fill="#FF3344" filter="url(#glow_card-git.svg)" />
    <text x="13" y="10" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">LIVE</text>
  </g>
</svg>