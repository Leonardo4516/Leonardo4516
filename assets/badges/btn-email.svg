<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" fill="none">
  <defs>
    <!-- Outer Bevel Gradient -->
    <linearGradient id="bevel_btn-email.svg" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3D0C0C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#150404" stop-opacity="0.6" />
    </linearGradient>

    <!-- Surface Titanium Gradient -->
    <linearGradient id="surface_btn-email.svg" x1="0" y1="0" x2="200" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A22" />
      <stop offset="40%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Top Highlight Inner Specular -->
    <linearGradient id="specular_btn-email.svg" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#FF3344" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <filter id="led_glow_btn-email.svg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Drop Shadow Base -->
  <rect x="2" y="3" width="196" height="42" rx="9" fill="#000000" fill-opacity="0.6" />

  <!-- Outer Bevel Rim -->
  <rect x="1" y="1" width="198" height="43" rx="9" fill="url(#surface_btn-email.svg)" stroke="url(#bevel_btn-email.svg)" stroke-width="1.5" />

  <!-- Inner Specular Reflection Line -->
  <line x1="12" y1="3" x2="188" y2="3" stroke="url(#specular_btn-email.svg)" stroke-width="1" stroke-linecap="round" />

  <!-- Left LED Power Dot Indicator -->
  <circle cx="20" cy="22" r="3" fill="#B91C1C" filter="url(#led_glow_btn-email.svg)" />
  <circle cx="20" cy="22" r="1.5" fill="#FFFFFF" />

  <!-- Icon Section -->
  <g transform="translate(32, 14)">
    <rect x="1" y="3" width="16" height="12" rx="2" stroke="#E50914" stroke-width="1.5" fill="none"/><path d="m17 5-8 6L1 5" stroke="#E50914" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="56" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">CONTACTO DIRECTO</text>
  
  <!-- Right Micro Arrow -->
  <path d="M182 19L185 22L182 25" stroke="#E50914" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>