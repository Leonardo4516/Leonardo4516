<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" viewBox="0 0 960 120" fill="none">
  <defs>
    <linearGradient id="wf_bg" x1="0" y1="0" x2="960" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#190F13" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#120A0E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090608" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wf_border" x1="0" y1="0" x2="960" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#FF3344" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#3D0B0F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="wf_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Drop Shadow -->
  <rect x="2" y="3" width="956" height="114" rx="14" fill="#000000" fill-opacity="0.7"/>

  <!-- Glass Card Body -->
  <rect x="1" y="1" width="958" height="116" rx="14" fill="url(#wf_bg)" stroke="url(#wf_border)" stroke-width="1.2"/>

  <!-- Connecting Laser Pipeline -->
  <line x1="120" y1="60" x2="840" y2="60" stroke="#FF2233" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <line x1="120" y1="60" x2="840" y2="60" stroke="#E50914" stroke-width="1.2" opacity="0.8" filter="url(#wf_glow)"/>

  <!-- Stage 1 -->
  <g transform="translate(40, 24)">
    <rect width="150" height="72" rx="10" fill="#140D10" stroke="#4A141A" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#FF3344" filter="url(#wf_glow)"/>
    <text x="32" y="26" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FASE 01</text>
    <text x="14" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Modelado DDD</text>
    <text x="14" y="60" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Dominio puro &amp; Reglas</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M202 60 L212 60 M208 56 L213 60 L208 64" stroke="#FF3344" stroke-width="2" stroke-linecap="round"/>

  <!-- Stage 2 -->
  <g transform="translate(225, 24)">
    <rect width="150" height="72" rx="10" fill="#140D10" stroke="#4A141A" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#FF3344" filter="url(#wf_glow)"/>
    <text x="32" y="26" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FASE 02</text>
    <text x="14" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Co-Diseño con IA</text>
    <text x="14" y="60" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Prompts &amp; Prototipado</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M387 60 L397 60 M393 56 L398 60 L393 64" stroke="#FF3344" stroke-width="2" stroke-linecap="round"/>

  <!-- Stage 3 -->
  <g transform="translate(410, 24)">
    <rect width="150" height="72" rx="10" fill="#140D10" stroke="#4A141A" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#FF3344" filter="url(#wf_glow)"/>
    <text x="32" y="26" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FASE 03</text>
    <text x="14" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Core &amp; Puertos</text>
    <text x="14" y="60" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Casos de Uso &amp; Interfaces</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M572 60 L582 60 M578 56 L583 60 L578 64" stroke="#FF3344" stroke-width="2" stroke-linecap="round"/>

  <!-- Stage 4 -->
  <g transform="translate(595, 24)">
    <rect width="150" height="72" rx="10" fill="#140D10" stroke="#4A141A" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#FF3344" filter="url(#wf_glow)"/>
    <text x="32" y="26" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FASE 04</text>
    <text x="14" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Adaptadores Spring</text>
    <text x="14" y="60" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">JWT, REST &amp; Flyway</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M757 60 L767 60 M763 56 L768 60 L763 64" stroke="#FF3344" stroke-width="2" stroke-linecap="round"/>

  <!-- Stage 5 -->
  <g transform="translate(780, 24)">
    <rect width="140" height="72" rx="10" fill="#140D10" stroke="#4A141A" stroke-width="1"/>
    <circle cx="20" cy="22" r="4" fill="#FF3344" filter="url(#wf_glow)"/>
    <text x="32" y="26" fill="#FFAAAA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">FASE 05</text>
    <text x="14" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Testing &amp; CI/CD</text>
    <text x="14" y="60" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">JUnit, Mockito &amp; Docker</text>
  </g>
</svg>