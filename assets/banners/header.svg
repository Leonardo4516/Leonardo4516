<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="red_glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#800A0A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="corner_glow" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08080A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D11" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="border_gradient" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#4A0E0E" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#200606" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="title_grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <pattern id="matrix_dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>
    <filter id="crimson_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="960" height="260" rx="16" fill="url(#bg_gradient)" />
  <rect width="960" height="260" rx="16" fill="url(#matrix_dots)" />
  <rect width="960" height="260" rx="16" fill="url(#red_glow)" />
  <rect width="960" height="260" rx="16" fill="url(#corner_glow)" />
  <rect x="1" y="1" width="958" height="258" rx="15" stroke="url(#border_gradient)" stroke-width="1.5" />

  <!-- Ambient Geometric Accents -->
  <line x1="60" y1="0" x2="60" y2="260" stroke="#E50914" stroke-opacity="0.08" stroke-dasharray="4 8" />
  <line x1="900" y1="0" x2="900" y2="260" stroke="#E50914" stroke-opacity="0.08" stroke-dasharray="4 8" />

  <!-- Status Indicator Badge -->
  <g transform="translate(64, 38)">
    <rect width="210" height="26" rx="13" fill="#17171C" stroke="#330C0C" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#E50914" filter="url(#crimson_glow)" />
    <circle cx="16" cy="13" r="2.5" fill="#FFFFFF" />
    <text x="28" y="17" fill="#E4E4E7" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="700" letter-spacing="1">BACKEND • SYSTEM DESIGN</text>
  </g>

  <!-- Main Name Title -->
  <text x="64" y="112" fill="url(#title_grad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Leonardo Hernández</text>
  
  <!-- Red Accent Divider Bar -->
  <rect x="64" y="126" width="70" height="3.5" rx="1.75" fill="#E50914" filter="url(#crimson_glow)" />
  <rect x="138" y="127" width="16" height="2" rx="1" fill="#521010" />

  <!-- Core Subtitle / Value Proposition -->
  <text x="64" y="156" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
    Especialista en <tspan fill="#FFFFFF" font-weight="700">Java 21 LTS</tspan> • <tspan fill="#FFFFFF" font-weight="700">Spring Boot</tspan> • Arquitectura Hexagonal (DDD) • Seguridad Stateless (JWT)
  </text>
  <text x="64" y="178" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">
    Modelado Relacional en PostgreSQL 16 • Migraciones Flyway • Desarrollo Asistido por Inteligencia Artificial
  </text>

  <!-- Tech Pillars Chips at Bottom -->
  <g transform="translate(64, 204)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="112" height="24" rx="6" fill="#141418" stroke="#2D0B0B" />
    <text x="12" y="16" fill="#E50914" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">JAVA 21 LTS</text>

    <!-- Pill 2 -->
    <rect x="120" y="0" width="124" height="24" rx="6" fill="#141418" stroke="#2D0B0B" />
    <text x="132" y="16" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SPRING BOOT 4</text>

    <!-- Pill 3 -->
    <rect x="252" y="0" width="134" height="24" rx="6" fill="#141418" stroke="#2D0B0B" />
    <text x="264" y="16" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DDD HEXAGONAL</text>

    <!-- Pill 4 -->
    <rect x="394" y="0" width="128" height="24" rx="6" fill="#141418" stroke="#2D0B0B" />
    <text x="406" y="16" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">FLYWAY • PG16</text>

    <!-- Pill 5 -->
    <rect x="530" y="0" width="136" height="24" rx="6" fill="#141418" stroke="#2D0B0B" />
    <text x="542" y="16" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">AI CO-ENGINEER</text>
  </g>
</svg>