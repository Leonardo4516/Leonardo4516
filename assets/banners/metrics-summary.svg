<svg xmlns="http://www.w3.org/2000/svg" width="960" height="154" viewBox="0 0 960 154" fill="none">
  <defs>
    <linearGradient id="gm_bg" x1="0" y1="0" x2="960" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1014" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#120B0E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080608" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gm_border" x1="0" y1="0" x2="960" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FF3344" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#4A0E14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gm_wave" x1="0" y1="0" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="gm_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Drop Shadow -->
  <rect x="2" y="4" width="956" height="146" rx="14" fill="#000000" fill-opacity="0.75"/>

  <!-- Glass Body -->
  <rect x="1" y="1" width="958" height="150" rx="14" fill="url(#gm_bg)" stroke="url(#gm_border)" stroke-width="1.2"/>

  <!-- Background Glowing Spline Wave across the dashboard -->
  <path d="M40 120 Q 150 90, 260 110 T 500 85 T 740 105 T 920 80 L 920 145 L 40 145 Z" fill="url(#gm_wave)"/>
  <path d="M40 120 Q 150 90, 260 110 T 500 85 T 740 105 T 920 80" stroke="#E50914" stroke-width="1.8" fill="none" opacity="0.8" filter="url(#gm_glow)"/>

  <!-- Col 1: Architecture -->
  <g transform="translate(48, 30)">
    <text x="0" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="900" letter-spacing="-0.5">DDD</text>
    <circle cx="70" cy="18" r="3" fill="#E50914" filter="url(#gm_glow)"/>
    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">Arquitectura Hexagonal</text>
    <text x="0" y="72" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Dominio puro • Puertos &amp; Adaptadores</text>
  </g>

  <!-- Divider 1 -->
  <line x1="265" y1="26" x2="265" y2="128" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Col 2: Database Versioning -->
  <g transform="translate(295, 30)">
    <text x="0" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="900" letter-spacing="-0.5">35+</text>
    <circle cx="68" cy="18" r="3" fill="#E50914" filter="url(#gm_glow)"/>
    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">Tablas Relacionales</text>
    <text x="0" y="72" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Control versionado con Flyway</text>
  </g>

  <!-- Divider 2 -->
  <line x1="500" y1="26" x2="500" y2="128" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Col 3: Security & Stateless -->
  <g transform="translate(530, 30)">
    <text x="0" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="900" letter-spacing="-0.5">RBAC</text>
    <circle cx="82" cy="18" r="3" fill="#E50914" filter="url(#gm_glow)"/>
    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">Seguridad Stateless</text>
    <text x="0" y="72" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Spring Security 6 • JWT Claims</text>
  </g>

  <!-- Divider 3 -->
  <line x1="735" y1="26" x2="735" y2="128" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Col 4: Testing & Quality -->
  <g transform="translate(765, 30)">
    <text x="0" y="26" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="900" letter-spacing="-0.5">100%</text>
    <circle cx="82" cy="18" r="3" fill="#E50914" filter="url(#gm_glow)"/>
    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">Testing Automatizado</text>
    <text x="0" y="72" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">JUnit 5 • Mockito • Docker</text>
  </g>
</svg>